name: Set Iteration on Close

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

permissions: {}

jobs:
  set-iteration:
    permissions: {}
    uses: ut-issl/github-project-workflows/.github/workflows/set-iteration-on-close.yml@85e71bdd6393d9183966295098a393633f9937d7 # main
    secrets:
      ITERATION_AUTOMATION_APP_ID: ${{ secrets.ITERATION_AUTOMATION_APP_ID }}
      ITERATION_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.ITERATION_AUTOMATION_APP_PRIVATE_KEY }}
